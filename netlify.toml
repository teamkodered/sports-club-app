[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # VITE_-prefixed values are intentionally inlined into the client
  # bundle by Vite -- that's the whole point of the VITE_ prefix, and
  # a Client ID is meant to be public in OAuth anyway (unlike the
  # Client Secret, which stays server-side only in Supabase). Netlify's
  # secret scanner flags it as a false positive; this tells it to skip
  # just this one key rather than disabling the scan entirely.
  SECRETS_SCAN_OMIT_KEYS = "VITE_WHOOP_CLIENT_ID"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers applied to every response. Content-Security-Policy
# is scoped to the exact external services this app actually talks to
# (Supabase, Google Fonts, Whoop) rather than left wide open -- if a
# future integration needs a new domain and something breaks/gets
# blocked, check the browser console for a CSP violation message
# naming exactly which directive to extend.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https://zhlefvardwawjstulifb.supabase.co; connect-src 'self' https://zhlefvardwawjstulifb.supabase.co wss://zhlefvardwawjstulifb.supabase.co https://api.prod.whoop.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
